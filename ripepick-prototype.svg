<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920">
  <rect width="1480" height="920" fill="#F5F6F1"/>
  <text x="64" y="58" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700">RipePick · MVP Prototype</text>
  <text x="64" y="86" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="13">核心流程：描述场景 → 理解目标 → 获得一份可执行的水果早餐方案</text>

  <g transform="translate(64 126)">
    <rect width="300" height="700" rx="28" fill="#FFFFFF" stroke="#DCE5DE" stroke-width="2"/>
    <rect x="1" y="1" width="298" height="78" rx="27" fill="#F0F5EE"/>
    <text x="24" y="35" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700">RipePick</text>
    <text x="24" y="57" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="11">今天，吃得刚刚好</text>
    <circle cx="254" cy="39" r="20" fill="#F6C85F"/>
    <circle cx="248" cy="34" r="3" fill="#173F35"/><circle cx="260" cy="34" r="3" fill="#173F35"/>
    <path d="M248 44 Q254 50 260 44" fill="none" stroke="#173F35" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="142" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="25" font-weight="700">今天想怎么吃？</text>
    <text x="24" y="170" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="13">告诉我你的饮食状态和目标</text>
    <rect x="24" y="204" width="252" height="158" rx="14" fill="#FBFCFA" stroke="#DCE5DE"/>
    <text x="40" y="233" fill="#A1ADA5" font-family="Arial, PingFang SC, sans-serif" font-size="13">例如：昨晚吃得比较油腻，</text>
    <text x="40" y="255" fill="#A1ADA5" font-family="Arial, PingFang SC, sans-serif" font-size="13">今天早上吃什么比较好？</text>
    <rect x="40" y="294" width="74" height="28" rx="14" fill="#E9F1E5"/><text x="54" y="313" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="11">清淡一点</text>
    <rect x="122" y="294" width="74" height="28" rx="14" fill="#E9F1E5"/><text x="137" y="313" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="11">当季水果</text>
    <rect x="204" y="294" width="56" height="28" rx="14" fill="#E9F1E5"/><text x="216" y="313" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="11">早餐</text>
    <rect x="24" y="388" width="252" height="50" rx="25" fill="#2D765C"/><text x="106" y="419" fill="#FFFFFF" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700">开始分析  →</text>
    <text x="24" y="500" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700">你会得到</text>
    <text x="24" y="532" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">✓ 一种适合当前场景的水果</text>
    <text x="24" y="557" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">✓ 一份简单的早餐搭配</text>
    <text x="24" y="582" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">✓ 理由、份量和必要提醒</text>
    <line x1="24" y1="631" x2="276" y2="631" stroke="#E8EDE8"/>
    <text x="24" y="660" fill="#9AA69E" font-family="Arial, PingFang SC, sans-serif" font-size="10">一般性饮食信息 · 不替代医疗建议</text>
  </g>

  <g transform="translate(408 126)">
    <rect width="300" height="700" rx="28" fill="#FFFFFF" stroke="#DCE5DE" stroke-width="2"/>
    <rect x="1" y="1" width="298" height="65" rx="27" fill="#F0F5EE"/>
    <text x="24" y="39" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700">‹  RipePick</text>
    <circle cx="150" cy="144" r="42" fill="#F6C85F"/>
    <path d="M124 149 Q150 111 176 149 Q150 178 124 149Z" fill="#F29C5C"/>
    <path d="M150 111 Q148 96 163 91" fill="none" stroke="#35735B" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="231" text-anchor="middle" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700">正在理解你的场景</text>
    <text x="150" y="260" text-anchor="middle" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="13">从水果和早餐数据中寻找合适组合</text>
    <rect x="40" y="310" width="220" height="10" rx="5" fill="#E7EEE6"/><rect x="40" y="310" width="142" height="10" rx="5" fill="#6DAA82"/>
    <text x="40" y="360" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12">已识别</text>
    <text x="40" y="386" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="14">时间：今天早上</text>
    <text x="40" y="416" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="14">目标：吃得清淡一些</text>
    <text x="40" y="446" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="14">背景：昨晚饮食偏油腻</text>
    <rect x="24" y="568" width="252" height="72" rx="14" fill="#F7F9F5"/>
    <text x="40" y="595" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">我们只会使用完成这次建议所需的信息。</text>
    <text x="40" y="618" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">不建立长期健康档案。</text>
  </g>

  <g transform="translate(752 126)">
    <rect width="300" height="700" rx="28" fill="#FFFFFF" stroke="#DCE5DE" stroke-width="2"/>
    <rect x="1" y="1" width="298" height="65" rx="27" fill="#F0F5EE"/>
    <text x="24" y="39" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700">‹  今日早餐建议</text>
    <text x="24" y="103" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="11">基于：昨晚饮食偏油腻 · 今天早上想清淡一些</text>
    <rect x="24" y="130" width="252" height="215" rx="18" fill="#FFF7E7"/>
    <circle cx="87" cy="204" r="52" fill="#F6C85F"/>
    <path d="M57 207 Q87 162 117 207 Q87 246 57 207Z" fill="#F29C5C"/>
    <path d="M87 154 Q85 140 101 135" fill="none" stroke="#35735B" stroke-width="6" stroke-linecap="round"/>
    <text x="155" y="186" fill="#9B5D2F" font-family="Arial, PingFang SC, sans-serif" font-size="12">主推荐</text>
    <text x="155" y="215" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="25" font-weight="700">木瓜</text>
    <text x="155" y="240" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">Papaya · 约 150g</text>
    <rect x="155" y="264" width="84" height="26" rx="13" fill="#F5E5B9"/><text x="168" y="282" fill="#8C6526" font-family="Arial, PingFang SC, sans-serif" font-size="11">口感柔和</text>
    <text x="24" y="380" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700">搭配一份</text>
    <text x="24" y="406" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="17">无糖酸奶 + 全麦吐司</text>
    <text x="24" y="440" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">水果提供风味和纤维，酸奶与吐司让早餐更完整。</text>
    <line x1="24" y1="468" x2="276" y2="468" stroke="#E8EDE8"/>
    <text x="24" y="500" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700">为什么这样建议？</text>
    <text x="24" y="526" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">口感清爽、容易组成一顿简单早餐。</text>
    <text x="24" y="548" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">这是一般性搭配建议，不代表治疗或“解油腻”。</text>
    <rect x="24" y="594" width="118" height="42" rx="21" fill="#2D765C"/><text x="48" y="620" fill="#FFFFFF" font-family="Arial, PingFang SC, sans-serif" font-size="13">换个推荐</text>
    <rect x="154" y="594" width="122" height="42" rx="21" fill="#E9F1E5"/><text x="178" y="620" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="13">继续追问</text>
  </g>

  <g transform="translate(1096 126)">
    <rect width="300" height="700" rx="28" fill="#FFFFFF" stroke="#DCE5DE" stroke-width="2"/>
    <rect x="1" y="1" width="298" height="65" rx="27" fill="#F0F5EE"/>
    <text x="24" y="39" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700">‹  继续和我聊聊</text>
    <rect x="24" y="102" width="220" height="64" rx="16" fill="#EEF4EC"/><text x="40" y="128" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12">昨晚吃得比较油腻，今天</text><text x="40" y="149" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12">早上吃什么比较好？</text>
    <circle cx="264" cy="134" r="18" fill="#F6C85F"/>
    <rect x="36" y="200" width="236" height="176" rx="16" fill="#FFF7E7"/>
    <text x="52" y="229" fill="#9B5D2F" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700">RipePick</text>
    <text x="52" y="258" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="13">如果不想吃木瓜，可以换成</text>
    <text x="52" y="282" fill="#173F35" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700">香蕉半根 + 无糖酸奶。</text>
    <text x="52" y="319" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">如果你对乳制品不耐受，也可以</text>
    <text x="52" y="340" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="12">告诉我，我会重新调整搭配。</text>
    <text x="24" y="442" fill="#718078" font-family="Arial, PingFang SC, sans-serif" font-size="11">你可以继续问：</text>
    <rect x="24" y="460" width="252" height="38" rx="19" fill="#F7F9F5" stroke="#DCE5DE"/><text x="40" y="484" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12">有没有更酸甜一点的水果？</text>
    <rect x="24" y="510" width="252" height="38" rx="19" fill="#F7F9F5" stroke="#DCE5DE"/><text x="40" y="534" fill="#35735B" font-family="Arial, PingFang SC, sans-serif" font-size="12">今天有什么当季水果？</text>
    <rect x="24" y="590" width="252" height="48" rx="24" fill="#FBFCFA" stroke="#DCE5DE"/><text x="42" y="620" fill="#A1ADA5" font-family="Arial, PingFang SC, sans-serif" font-size="12">输入你的新问题…</text><circle cx="248" cy="614" r="15" fill="#2D765C"/><text x="243" y="619" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">↑</text>
  </g>
</svg>
